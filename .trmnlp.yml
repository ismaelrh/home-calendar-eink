# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
# auto-reload when files change (`watch: false` to disable)
watch:
  - .trmnlp.yml
  - src

# values of custom fields (defined in src/settings.yml)
custom_fields: {}

# override variables
variables:
  calendar_source:
    time_format: '24h'
    today_in_tz: '2026-09-06T00:00:00+02:00'
    events:
      - summary: '[R] Stand-up diario (debe ocultarse)'
        date_time: '2026-09-07T08:30:00+02:00'
        start_full: '2026-09-07T08:30:00+02:00'
        end_full: '2026-09-07T08:45:00+02:00'
        start: '08:30'
        end: '08:45'
        all_day: false
        description: 'Evento recurrente de prueba'
      - summary: 'Café de bienvenida'
        date_time: '2026-09-06T16:00:00+02:00'
        start_full: '2026-09-06T16:00:00+02:00'
        end_full: '2026-09-06T16:30:00+02:00'
        start: '16:00'
        end: '16:30'
        all_day: false
        description: 'Evento de prueba para hoy'
      - summary: 'Reunión de equipo'
        date_time: '2026-09-07T09:30:00+02:00'
        start_full: '2026-09-07T09:30:00+02:00'
        end_full: '2026-09-07T10:15:00+02:00'
        start: '09:30'
        end: '10:15'
        all_day: false
        description: 'Revisión semanal del proyecto'
      - summary: 'Entrega del informe'
        date_time: '2026-09-08T00:00:00+02:00'
